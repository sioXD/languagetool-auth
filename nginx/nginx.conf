# HTTPS-Variante für sioxd.duckdns.org
#
# Aktivierung (erst wenn certs/fullchain.pem + certs/privkey.pem existieren):
#   cp nginx/nginx.https.conf nginx/nginx.conf
#   docker compose up -d
#
# LanguageTool bleibt ausschließlich über den geheimen Pfad erreichbar.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=lt:10m rate=10r/s;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    # Optional: nur nötig, wenn Port 80 am Router freigegeben wird.
    server {
        listen 80;
        server_name sioxd.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name sioxd.duckdns.org;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 10m;

        # Alles außer dem geheimen Pfad ist nicht erreichbar.
        location / {
            return 404;
        }

        include /etc/nginx/secret.conf;
        include /etc/nginx/tradebot.conf;
    }
}
