# nginx for LanguageTool
#
# LanguageTool is only accessible via the secret path (hash).
# No usernames/passwords.
#
# The public port is set in setup.sh and mapped to the internal container port 8082.
# nginx always listens on 8082 internally.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Rate limit: max 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=lt:10m rate=10r/s;

    # LanguageTool may need more time for long texts
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    server {
        listen 8082;
        server_name _;

        client_max_body_size 10m;   # allow large texts

        # Everything except the secret path is not accessible
        location / {
            return 404;
        }

        # Secret path (hash), generated by setup.sh
        # Example: /591f6fcd7573863a47a8b7b265310e65/v2
        include /etc/nginx/secret.conf;
    }
}
