# nginx für LanguageTool mit HTTP Basic Auth
# Achtung: Dieser Listen-Port MUSS zum Port in docker-compose.yml passen (PUBLIC_PORT).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Rate-Limit: max. 10 Requests/Sekunde pro IP (schützt vor Missbrauch)
    limit_req_zone $binary_remote_addr zone=lt:10m rate=10r/s;

    # LanguageTool kann bei langen Texten etwas brauchen
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    server {
        listen 8082;
        server_name _;

        client_max_body_size 10m;   # erlaubt große Textmengen

        location / {
            # --- Zugriff: LAN/Server-PC ohne Passwort, sonst HTTP Basic Auth ---
            # Die Extension kann KEIN Passwort senden. Im LAN (und für Zugriffe
            # vom Host, die als Docker-Gateway erscheinen) erlauben wir daher
            # den Zugriff ohne Passwort. Alles andere braucht Basic Auth.
            satisfy any;
            allow 127.0.0.0/8;      # loopback
            allow 172.16.0.0/12;    # Docker-Netze (Host-Zugriffe erscheinen so)
            allow 192.168.0.0/16;   # typisches Heimnetz
            allow 10.0.0.0/8;       # weitere private Netze
            deny all;

            auth_basic "LanguageTool - bitte einloggen";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # --- Rate-Limit ---
            limit_req zone=lt burst=20 nodelay;

            # --- Weiterleitung an den LanguageTool-Container (DNS-Name aus Docker-Netz) ---
            proxy_pass http://languagetool:8010;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Geheimer Pfad für die LanguageTool-Extension (ohne Passwort) ---
        # Der Inhalt wird von setup.sh aus LT_SECRET erzeugt (siehe .env).
        include /etc/nginx/secret.conf;
    }
}