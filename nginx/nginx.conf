# nginx für LanguageTool
#
# LanguageTool ist ausschließlich über den geheimen Pfad (Hash) erreichbar.
# Es gibt keine Benutzernamen/Passwörter mehr.
#
# Der öffentliche Port wird in setup.sh festgelegt und beim Start auf den
# internen Container-Port 8082 gemappt. nginx selbst lauscht immer auf 8082.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Rate-Limit: max. 10 Requests/Sekunde pro IP (schützt vor Missbrauch)
    limit_req_zone $binary_remote_addr zone=lt:10m rate=10r/s;

    # LanguageTool kann bei langen Texten etwas brauchen
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    server {
        listen 8082;
        server_name _;

        client_max_body_size 10m;   # erlaubt große Textmengen

        # Alles außer dem geheimen Pfad ist nicht erreichbar.
        location / {
            return 404;
        }

        # Geheimer Pfad (Hash), wird von setup.sh erzeugt.
        # Beispiel: /591f6fcd7573863a47a8b7b265310e65/v2
        include /etc/nginx/secret.conf;
    }
}
