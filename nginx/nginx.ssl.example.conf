# Variante mit HTTPS (Let's Encrypt) – NUR falls du eine Domain hast.
# Verwendung: siehe README.md, Abschnitt "HTTPS (empfohlen)".
# Diese Datei ersetzt nginx/nginx.conf und muss die Zertifikate
# unter /etc/nginx/certs/ sehen (siehe docker-compose-Anpassung im README).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=lt:10m rate=10r/s;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    # HTTP (Port 8082) -> HTTPS umleiten
    server {
        listen 8082;
        server_name deine-domain.de;
        return 301 https://$host$request_uri;
    }

    # HTTPS (Port 8443) mit Basic Auth
    server {
        listen 8443 ssl;
        server_name deine-domain.de;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 10m;

        location / {
            auth_basic "LanguageTool - bitte einloggen";
            auth_basic_user_file /etc/nginx/.htpasswd;

            limit_req zone=lt burst=20 nodelay;

            proxy_pass http://languagetool:8010;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}