# Tradebot-Dashboard + JSON-API, erreichbar unter
#   https://sioxd.duckdns.org/trade/   (Streamlit, Login nur mit Passwort)
#   https://sioxd.duckdns.org/api/     (JSON, Bearer-Token)
#
# Wird per include in den 443-server-Block von nginx.conf geladen.

# Docker-DNS. Wichtig: Container werden beim Passwortwechsel neu erstellt und
# bekommen dabei neue IPs. Ohne resolver wuerde nginx die alte IP cachen und
# mit 502 antworten, bis nginx neu startet.
resolver 127.0.0.11 valid=10s ipv6=off;

# Upstreams als Variablen -> nginx fragt den resolver bei jeder Anfrage.
set $tb_auth      tradebot-auth:8001;
set $tb_api       tradebot-api:8000;
set $tb_dashboard tradebot-dashboard:8501;

# --- Login nur mit Passwort (Cookie-Session, kein Benutzername) ---
location = /login  { proxy_pass http://$tb_auth; }
location = /auth   { proxy_pass http://$tb_auth; }
location = /logout { proxy_pass http://$tb_auth; }

# Interner Auth-Check: nginx fragt bei jeder Dashboard-Anfrage hier nach.
location = /_tb_auth {
    internal;
    set $tb_auth_host tradebot-auth:8001;
    proxy_pass http://$tb_auth_host/_auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
}

# /trade ohne Slash -> /trade/ (sonst findet Streamlit die Assets nicht)
location = /trade {
    return 301 /trade/;
}

location /trade/ {
    auth_request /_tb_auth;
    error_page 401 = @tb_login;

    proxy_pass http://$tb_dashboard;
    proxy_http_version 1.1;

    # Streamlit braucht WebSockets fuer Live-Updates.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit streamt; Puffern wuerde die UI haengen lassen.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @tb_login {
    return 302 /login;
}

# API prueft selbst Bearer-Token bzw. Basic-Passwort.
# So kann das Widget denselben Wert wie das Webseiten-Passwort verwenden.
location /api/ {
    proxy_pass http://$tb_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
