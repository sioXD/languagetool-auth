services:
  languagetool:
    image: erikvl87/languagetool:latest
    container_name: languagetool
    restart: unless-stopped
    environment:
      Java_Xms: 512m          # Start-Heap
      Java_Xmx: 2g            # Max. Heap – anpassen, wenn der PC wenig RAM hat (z. B. 1g)
      # n-gram-Daten (optional). Der Ordner /ngrams muss die Sprachordner
      # (en/, de/, ...) enthalten. Wird vom Setup befüllt; ohne Daten wird
      # dieser Pfad einfach ignoriert.
      langtool_languageModel: /ngrams
    volumes:
      # Optional heruntergeladene n-gram-Daten (read-only).
      # Existiert der Ordner nicht, legt Docker ihn leer an.
      - ./ngrams:/ngrams:ro
    networks:
      - lan
    # Bewusst KEIN ports-Eintrag:
    # LanguageTool ist nur über nginx (geheimer Pfad) erreichbar.

  nginx:
    image: nginx:1.27-alpine
    container_name: languagetool-nginx
    restart: unless-stopped
    depends_on:
      - languagetool
    ports:
      # Öffentlicher Port – wird von setup.sh gesetzt (PUBLIC_PORT).
      # Intern lauscht nginx immer auf 8082.
      - "${PUBLIC_PORT:-8082}:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/secret.conf:/etc/nginx/secret.conf:ro
    networks:
      - lan

networks:
  lan:
