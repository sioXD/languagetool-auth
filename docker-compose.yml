services:
  languagetool:
    image: erikvl87/languagetool:latest
    container_name: languagetool
    restart: unless-stopped
    environment:
      Java_Xms: 512m # Initial heap
      Java_Xmx: 2g # Max heap - adjust if your PC has limited RAM (e.g. 1g)
      # n-gram data (optional). The /ngrams folder must contain language subfolders
      # (de/, en/, ...). Populated by setup.sh; if empty, this is ignored.
      langtool_languageModel: /ngrams
    volumes:
      # Optional downloaded n-gram data (read-only).
      # If the folder doesn't exist, Docker will create it empty.
      - ./ngrams:/ngrams:ro
    networks:
      - lan
    # No ports exposed directly:
    # LanguageTool is only accessible via nginx with the secret path.

  nginx:
    image: nginx:1.27-alpine
    container_name: languagetool-nginx
    restart: unless-stopped
    depends_on:
      - languagetool
    ports:
      # Public port - set by setup.sh (PUBLIC_PORT).
      # Internally nginx always listens on 8082.
      - "${PUBLIC_PORT:-8082}:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/secret.conf:/etc/nginx/secret.conf:ro
    networks:
      - lan

networks:
  lan:
